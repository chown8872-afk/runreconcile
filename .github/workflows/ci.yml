name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build, install, and run the packaged demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install dist/*.whl
          .artifact-venv/bin/runreconcile --version

      - name: Run end-to-end demo from the wheel
        env:
          RUNRECONCILE_BIN: ${{ github.workspace }}/.artifact-venv/bin/runreconcile
          PYTHON_BIN: ${{ github.workspace }}/.artifact-venv/bin/python
        run: ./scripts/run_demo.sh

      - name: Upload checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: runreconcile-distributions
          path: dist/*
          if-no-files-found: error
