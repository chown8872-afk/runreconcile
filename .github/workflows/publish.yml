name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag (for example, v0.1.1)"
        required: true
        type: string

run-name: Publish ${{ inputs.tag }} to PyPI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"release tag {tag!r} is not vMAJOR.MINOR.PATCH")

          tags_at_head = subprocess.run(
              ["git", "tag", "--points-at", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if tag not in tags_at_head:
              raise SystemExit(f"checked-out commit is not tagged {tag!r}")

          expected = tag[1:]
          metadata = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          actual = metadata["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag version {expected!r} does not match package version {actual!r}")
          PY

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions for isolated publish jobs
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runreconcile
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
