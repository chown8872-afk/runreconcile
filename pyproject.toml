[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runreconcile"
version = "0.1.1"
description = "Local-only post-run verification with final-state and write-boundary receipts"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Neo Chen" },
]
maintainers = [
  { name = "Neo Chen" },
]
keywords = [
  "automation",
  "ci",
  "devops",
  "reconciliation",
  "receipts",
  "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "tomli; python_version < '3.11'",
]

[project.scripts]
runreconcile = "runreconcile.cli:main"

[project.urls]
Homepage = "https://github.com/chown8872-afk/runreconcile"
Repository = "https://github.com/chown8872-afk/runreconcile"
Issues = "https://github.com/chown8872-afk/runreconcile/issues"
Changelog = "https://github.com/chown8872-afk/runreconcile/blob/main/CHANGELOG.md"
Security = "https://github.com/chown8872-afk/runreconcile/security/policy"

[tool.setuptools.packages.find]
where = ["src"]
